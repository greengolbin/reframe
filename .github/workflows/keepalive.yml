# Supabase free projects pause after a week without activity. This pings the database twice a week.
name: keep-alive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST \
            -H "apikey: sb_publishable_uuqYyyHWo2zojpRhZX3A6A_Y8ibZTH2" \
            -H "Content-Type: application/json" -d '{}' \
            "https://icxzdcxilduoidryovkm.supabase.co/rest/v1/rpc/ping"
